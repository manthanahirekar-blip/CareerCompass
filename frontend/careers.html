<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCompass</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="CSS Folder/navbar.css">
    <link rel="stylesheet" href="CSS Folder/footer.css">
    <link rel="stylesheet" href="CSS Folder/careers.css">

</head>

<body>
<div id="navbar"></div>
    <!-- ==========================
        CAREER HERO SECTION
========================== -->

      <section class="hero-section">
        <div class="container">
            <div class="hero-badge">EXPLORE CAREER PATHS</div>
            <h1>

                Find The Right Career
                <br>
                For Your Future.

            </h1>
            <p> Explore in-demand careers, compare opportunities, and discover the skills you need to achieve
                        your goals.</p>

            <!-- <div class="hero-buttons">
                <a href="#" class="btn-primary">Explore Careers</a>
                <a href="#" class="btn-secondary">Browse Roadmaps</a>
            </div> -->


        </div>
    </section>

    <!-- ==========================
        CAREER FILTER SECTION
========================== -->

    <section class="career-filter">

    <div class="container">

        <div class="filter-wrapper">

            <!-- ======================
                    SEARCH BAR
            ======================= -->

            <div class="search-box">

                <i class="ri-search-line"></i>

                <input
                    type="text"
                    placeholder="Search career by title, skills or keywords..."
                    autocomplete="off"
                >

            </div>


            <!-- ======================
                CAREER CATEGORIES
            ======================= -->

            <div class="category-section">

                <h3>Browse by Category</h3>

                <div class="category-list">

                    <button class="category-btn active" type="button">
                        All
                    </button>

                    <button class="category-btn" type="button">
                        Development
                    </button>

                    <button class="category-btn" type="button">
                        AI & Data
                    </button>

                    <button class="category-btn" type="button">
                        Cloud
                    </button>

                    <button class="category-btn" type="button">
                        Cyber Security
                    </button>

                    <button class="category-btn" type="button">
                        Design
                    </button>

                    <button class="category-btn" type="button">
                        Business
                    </button>

                </div>

            </div>


            <!-- ======================
                    FILTERS
            ======================= -->

            <div class="filter-section">


                <!-- Salary -->

                <div class="filter-group">

                    <label for="salary">
                        Salary Range
                    </label>

                    <select id="salary">

                        <option value="All">
                            All Salaries
                        </option>

                        <option value="3-6">
                            ₹3 - 6 LPA
                        </option>

                        <option value="6-10">
                            ₹6 - 10 LPA
                        </option>

                        <option value="10-20">
                            ₹10 - 20 LPA
                        </option>

                        <option value="20+">
                            ₹20+ LPA
                        </option>

                    </select>

                </div>


                <!-- Difficulty -->

                <div class="filter-group">

                    <label for="difficulty">
                        Difficulty Level
                    </label>

                    <select id="difficulty">

                        <option value="All">
                            All Levels
                        </option>

                        <option value="Beginner">
                            Beginner
                        </option>

                        <option value="Intermediate">
                            Intermediate
                        </option>

                        <option value="Advanced">
                            Advanced
                        </option>

                    </select>

                </div>


                <!-- Demand -->

                <div class="filter-group">

                    <label for="demand">
                        Job Demand
                    </label>

                    <select id="demand">

                        <option value="All">
                            All Demand
                        </option>

                        <option value="Very High">
                            Very High
                        </option>

                        <option value="High">
                            High
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Low">
                            Low
                        </option>

                    </select>

                </div>


                <!-- Clear Filters -->

                <button class="clear-filter" type="button">

                    <i class="ri-refresh-line"></i>

                    Clear Filters

                </button>

            </div>

        </div>

    </div>

</section>


    <section class="career-list">

        <div class="container">

            <div class="career-grid">

                <!-- JS will generate cards -->

            </div>

            <p class="no-results">
                🔍 No careers match your search or selected filters.
            </p>

            <div class="show-more-wrapper">
                <button class="show-more-btn">
                    Show More
                    <i class="ri-arrow-down-s-line"></i>
                </button>
                <button class="show-less-btn" style="display:none;">
                    Show Less
                    <i class="ri-arrow-up-s-line"></i>
                </button>
            </div>

        </div>

    </section>


<div id="footer"></div>

    <script src="JS Folder/navbar.js"></script>
    <script src="JS Folder/footer.js"></script>
    <script src="JS Folder/careers.js"></script>
</body>

</html>
