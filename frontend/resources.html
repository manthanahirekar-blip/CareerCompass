<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Resources - CareerCompass</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="CSS Folder/navbar.css">
    <link rel="stylesheet" href="CSS Folder/footer.css">
    <link rel="stylesheet" href="CSS Folder/roadmap-details.css">
    <link rel="stylesheet" href="CSS Folder/resources.css">

</head>

<body>

    <div id="navbar"></div>

    <!-- ==========================
        LOADING STATE
    =========================== -->
    <div class="state-container" id="loadingState">
        <div class="spinner"></div>
        <p>Loading resources...</p>
    </div>


    <!-- ==========================
        ERROR STATE
        (missing/invalid step param, API error, step not found)
    =========================== -->
    <div class="state-container" id="errorState" style="display:none;">
        <i class="ri-error-warning-line state-icon"></i>
        <h2 id="errorTitle">Something went wrong</h2>
        <p id="errorMessage">We couldn't load these resources. Please try again.</p>
        <a href="careers.html" class="nav-btn">Back to Careers</a>
    </div>


    <!-- ==========================
        MAIN RESOURCE CONTENT
        (hidden until data loads)
    =========================== -->
    <div id="resourcesContent" style="display:none;">

        <!-- STEP HEADER -->
        <section class="step-header-section">
            <div class="container">
                <a href="#" class="back-to-roadmap-btn">
                    <i class="ri-arrow-left-line"></i>
                    Back to Roadmap
                </a>

                <span class="step-header-career"></span>
                <span class="step-header-badge">STEP <span class="step-header-number"></span></span>
                <h1 class="step-header-title"></h1>
            </div>
        </section>

        <!-- VIDEO LEARNING -->
        <section class="resource-section">
            <div class="container">
                <h2 class="resource-section-title">
                    <i class="ri-play-circle-line"></i>
                    Video Learning
                </h2>

                <div id="videoBlock">
                    <!-- JS renders either the player+playlist or an empty state -->
                </div>
            </div>
        </section>

        <!-- NOTES & STUDY MATERIALS -->
        <section class="resource-section">
            <div class="container">
                <h2 class="resource-section-title">
                    <i class="ri-file-text-line"></i>
                    Notes &amp; Study Materials
                </h2>

                <div id="notesList" class="notes-list">
                    <!-- JS renders one or more horizontal note cards -->
                </div>
            </div>
        </section>

        <!-- OFFICIAL DOCUMENTATION -->
        <section class="resource-section">
            <div class="container">
                <h2 class="resource-section-title">
                    <i class="ri-book-open-line"></i>
                    Official Documentation
                </h2>

                <div id="docsBlock">
                    <!-- JS renders either the doc grid or an empty state -->
                </div>
            </div>
        </section>

    </div>


    <!-- TOAST CONTAINER -->
    <div id="toastContainer" class="toast-container"></div>


   <div id="footer"></div>
    <script src="JS Folder/navbar.js"></script>
    <script src="JS Folder/footer.js"></script>
    <script src="JS Folder/resources.js"></script>
</body>

</html>
